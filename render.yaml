# Render Blueprint for NimiqEarn Quest.
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# After the first deploy, fill in the `sync: false` values (BOT_TOKEN, NEXT_PUBLIC_BOT_URL, …)
# in each service's Environment tab. Render assigns URLs as https://<service-name>.onrender.com —
# if a name collides globally Render adds a suffix; update the hardcoded URLs below to match.

databases:
  - name: nimiqearn-db
    databaseName: nimiqearn
    user: nimiqearn
    plan: free # free Postgres expires after 90 days — upgrade or use Supabase for production

services:
  # ---------------------------------------------------------------- Redis (sessions + rate limits)
  - type: redis
    name: nimiqearn-redis
    plan: free
    ipAllowList: [] # internal connections only

  # ---------------------------------------------------------------------------------- Verifier (Python AI)
  - type: web
    name: nimiqearn-verifier
    runtime: docker
    plan: free
    dockerfilePath: ./apps/verifier/Dockerfile
    dockerContext: ./apps/verifier
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8090"
      - key: VERIFIER_SHARED_SECRET
        sync: false # must match API VERIFIER_SHARED_SECRET

  # ---------------------------------------------------------------------------------- API (Fastify)
  - type: web
    name: nimiqearn-api
    runtime: node
    plan: free # free web services spin down when idle (cold starts)
    # db:push syncs the Postgres schema with prisma/schema.prisma on every deploy (additive
    # changes only — new tables/columns/enums). Without it, new models exist in the generated
    # client but not the DB, causing runtime 500s. DATABASE_URL is injected at build time.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm db:generate && pnpm build:packages && pnpm --filter @nimiqearn/api build && pnpm db:push
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nimiqearn-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nimiqearn-redis
          property: connectionString
      - fromGroup: nimiqearn-secrets # provides API_SHARED_SECRET
      - key: NIMIQ_NETWORK
        value: mainnet
      - key: NIMIQ_RPC_URL
        sync: false # Albatross RPC node (balance checks + escrow funding). Testnet: https://rpc.testnet.nimiqwatch.com/
      - key: ESCROW_ENCRYPTION_KEY
        generateValue: true # encrypts per-quest escrow wallet keys at rest (generated once)
      - key: PLATFORM_FEE_PERCENT
        value: "6" # platform fee charged to creators on top of the reward pool at publish
      - key: PLATFORM_FEE_ADDRESS
        sync: false # Nimiq address that receives platform + promotion fees (unset = no fees)
      - key: PROMOTION_FEE_NIM
        value: "100" # flat NIM fee to promote ("premium ad") a quest
      - key: BOT_TOKEN
        sync: false # from @BotFather — required to verify Mini App initData on studio/worker routes
      - key: ADMIN_API_KEY
        sync: false # optional: enables /api/admin/* endpoints
      - key: VERIFIER_URL
        value: https://nimiqearn-verifier.onrender.com
      - key: VERIFIER_SHARED_SECRET
        sync: false # must match nimiqearn-verifier
      - key: PAYOUT_QUEUE_ENABLED
        value: "0" # set to 1 + run payout worker when enabling BullMQ payouts
      - key: SENTRY_DSN
        sync: false # optional: enables Sentry error monitoring for the API

  # ------------------------------------------------------------------------------- Bot (grammY, poll)
  - type: worker
    name: nimiqearn-bot
    runtime: node
    plan: starter # background workers are not offered on the free tier
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm db:generate && pnpm build:packages && pnpm --filter @nimiqearn/bot build
    startCommand: node apps/bot/dist/index.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false # from @BotFather
      - key: REDIS_URL
        fromService:
          type: redis
          name: nimiqearn-redis
          property: connectionString
      - key: API_URL
        value: https://nimiqearn-api.onrender.com
      - key: WEB_PUBLIC_URL
        value: https://nimiqearn-web.onrender.com
      - fromGroup: nimiqearn-secrets # provides API_SHARED_SECRET (must match the API)
      - key: SENTRY_DSN
        sync: false # optional: enables Sentry error monitoring for the bot
      # WEBHOOK_URL intentionally unset → the bot uses long polling (no public URL needed).

  # ------------------------------------------------------------------------------- Web (Next.js)
  - type: web
    name: nimiqearn-web
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @nimiqearn/shared build && pnpm --filter @nimiqearn/web build
    startCommand: pnpm --filter @nimiqearn/web exec next start -p $PORT
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_INTERNAL_URL
        value: https://nimiqearn-api.onrender.com # web proxies /api/wallet/verify/* here
      - key: NEXT_PUBLIC_BOT_URL
        sync: false # e.g. https://t.me/YourBot
      - key: NEXT_PUBLIC_HUB_URL
        value: https://hub.nimiq.com # use https://hub.nimiq-testnet.com for testnet
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        sync: false # optional
      - key: SENTRY_DSN
        sync: false # optional: server-side Sentry error monitoring for the web app
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false # optional: browser-side Sentry error monitoring for the web app

envVarGroups:
  - name: nimiqearn-secrets
    envVars:
      - key: API_SHARED_SECRET
        generateValue: true # generated once, shared by the API and the bot
